name: Deploy to Scalingo

on:
  push:
    branches:
      - prod
  workflow_run:
    workflows: ["Terraform Scalingo Provision"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set app name
        run: |
          echo "app_name=mon-application-terraform" >> $GITHUB_ENV
      
      - name: Create application archive
        run: |
          cd app
          tar -czf ../app.tar.gz .
      
      - name: Install Scalingo CLI
        run: |
          curl -O https://cli-dl.scalingo.com/install && bash install

      - name: Deploy to Scalingo
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_TOKEN }}
        run: |
          scalingo --app ${{ env.app_name }} deploy app.tar.gz 