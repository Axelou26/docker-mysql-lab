name: Deploy to Scalingo

on:
  push:
    branches:
      - prod
  workflow_run:
    workflows: ["Terraform Scalingo Provision"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set app name
        run: |
          echo "app_name=mon-application-terraform" >> $GITHUB_ENV
      
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALINGO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

      - name: Deploy to Scalingo
        uses: kolok/deploy-to-scalingo@v1
        with:
          ssh-private-key: ${{ secrets.SCALINGO_SSH_KEY }}
          app-name: ${{ env.app_name }}
          known-host: "ssh.osc-fr1.scalingo.com ssh-rsa " 